aid: academia
name: Academia
description: >-
  Academia (Academia.edu, Academia Inc.) is a San Francisco based platform for sharing and discovering
  academic research, founded in 2008 by Richard Price. Registered researchers upload papers, build public
  profiles, follow research interests and track readership analytics across a corpus of tens of millions of
  documents, and the company also runs the Academia journals program and sells Academia Premium
  subscriptions for advanced search, mentions, reader analytics and bulk PDF downloads. Academia publishes
  no public developer program, API reference or machine-readable specification; the /v0 JSON endpoints its
  own web client calls are explicitly disallowed to crawlers in robots.txt. It does publish an RFC 9116
  security.txt with a named security contact and a disclosure posture, and a long per-crawler robots.txt
  that names AI and agent user-agents individually.
